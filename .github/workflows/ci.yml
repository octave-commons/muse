          ).targets ?? {};
          const ownershipKey = `${process.env.MUSE_TEST_MCP_PRODUCER_ID}:mcp-server`;
          if (ownership[ownershipKey] !== "eta-mu-retired") {
            throw new Error(`crash did not preserve the old ownership state: ${JSON.stringify(ownership)}`);
          }
          NODE
          rm .muse-host-targets.lock/owner
          rmdir .muse-host-targets.lock

          mkdir "$manifest_dir/recovery-bin"
          cat > "$manifest_dir/recovery-bin/clojure" <<SH
          #!/usr/bin/env bash
          set -euo pipefail
          if [[ " \$* " == *"eta-mu.mcp.build/generate-entrypoint"* ]]; then
            "$real_node" --input-type=module <<'NODE'
          import {existsSync, readFileSync} from "node:fs";
          if (existsSync(".muse-host-targets-transaction.json")) {
            throw new Error("MCP transaction marker still exists at generator invocation");
          }
          const registry = JSON.parse(readFileSync(".mcp.json", "utf8")).mcpServers ?? {};
          const expectedRegistry = ["eta-mu-claude", "eta-mu-receipt-river"];
          if (JSON.stringify(Object.keys(registry).sort()) !== JSON.stringify(expectedRegistry)) {
            throw new Error("MCP registry was not recovered before generation: " + JSON.stringify(registry));
          }
          const ownership = JSON.parse(
            readFileSync(".muse-host-targets-owners.json", "utf8"),
          );
          const expectedOwnership = {
            version: 2,
            targets: {
              [process.env.MUSE_TEST_MCP_PRODUCER_ID + ":claude-server"]: "eta-mu-claude",
              [process.env.MUSE_TEST_MCP_PRODUCER_ID + ":mcp-server"]: "eta-mu-receipt-river",
            },
          };
          if (JSON.stringify(ownership) !== JSON.stringify(expectedOwnership)) {
            throw new Error("MCP ownership was not recovered before generation: " + JSON.stringify(ownership));
          }
          NODE
            exit 75
          fi
          exec "$real_clojure" "\$@"
          SH
          chmod +x "$manifest_dir/recovery-bin/clojure"
          set +e
          PATH="$manifest_dir/recovery-bin:$PATH" \
            scripts/build-host-targets.sh mcp-server 2>&1 | tee -a host-build.log
          recovery_status="${PIPESTATUS[0]}"
          set -e
          test "$recovery_status" -eq 75
          grep -Fq 'recovering interrupted MCP state transaction' host-build.log
          test ! -e .muse-host-targets-transaction.json
          test ! -e .muse-host-targets.lock
          assert_mcp_state
          test "$(stat -c '%d:%i' .mcp.json)" != "$registry_identity_before"
          test "$(stat -c '%d:%i' .muse-host-targets-owners.json)" \
            != "$owners_identity_before"
          exec {registry_inode_fd}<&-
          exec {owners_inode_fd}<&-
          sha256sum .mcp.json > "$manifest_dir/after-mcp.sha256"
          sha256sum .muse-host-targets-owners.json \
            > "$manifest_dir/after-mcp-owners.sha256"
          diff -u "$manifest_dir/first-mcp.sha256" "$manifest_dir/after-mcp.sha256"
          diff -u \
            "$manifest_dir/first-mcp-owners.sha256" \
            "$manifest_dir/after-mcp-owners.sha256"

          node --input-type=module - "$manifest_dir/reader.stop" <<'NODE' &
          import {existsSync, readFileSync} from "node:fs";
          const [stopPath] = process.argv.slice(2);
          const waitState = new Int32Array(new SharedArrayBuffer(4));
          const expected = ["eta-mu-claude", "eta-mu-receipt-river"];
          while (!existsSync(stopPath)) {
            const servers = JSON.parse(readFileSync(".mcp.json", "utf8")).mcpServers ?? {};
            if (JSON.stringify(Object.keys(servers).sort()) !== JSON.stringify(expected)) {
              throw new Error(`reader observed transient MCP state: ${Object.keys(servers).sort()}`);
            }
            Atomics.wait(waitState, 0, 0, 1);
          }
          NODE
          reader_pid="$!"
          registry_inode_before="$(stat -c %i .mcp.json)"
          owners_inode_before="$(stat -c %i .muse-host-targets-owners.json)"
          set +e
          scripts/build-host-targets.sh claude-server 2>&1 | tee -a host-build.log
          claude_status="${PIPESTATUS[0]}"
          touch "$manifest_dir/reader.stop"
          wait "$reader_pid"
          reader_status="$?"
          set -e
          test "$claude_status" -eq 0
          test "$reader_status" -eq 0
          assert_mcp_state
          test "$(stat -c %i .mcp.json)" != "$registry_inode_before"
          test "$(stat -c %i .muse-host-targets-owners.json)" != "$owners_inode_before"
          sha256sum .mcp.json > "$manifest_dir/after-claude.sha256"
          sha256sum .muse-host-targets-owners.json \
            > "$manifest_dir/after-claude-owners.sha256"
          diff -u "$manifest_dir/first-mcp.sha256" "$manifest_dir/after-claude.sha256"
          diff -u \
            "$manifest_dir/first-mcp-owners.sha256" \
            "$manifest_dir/after-claude-owners.sha256"

          node --input-type=module <<'NODE'
          import {readFileSync, writeFileSync} from "node:fs";
          for (const path of [".mcp.json", ".muse-host-targets-owners.json"]) {
            writeFileSync(path, `${JSON.stringify(JSON.parse(readFileSync(path, "utf8")))}\n`);
          }
          NODE
          sha256sum .mcp.json > "$manifest_dir/before-failure.sha256"
          sha256sum .muse-host-targets-owners.json \
            > "$manifest_dir/before-failure-owners.sha256"
          rollback_hash="$(cut -d ' ' -f 1 "$manifest_dir/before-failure.sha256")"
          rollback_owners_hash="$(cut -d ' ' -f 1 "$manifest_dir/before-failure-owners.sha256")"
          real_node="$(command -v node)"
          real_mv="$(command -v mv)"
          mkdir "$manifest_dir/failing-bin"
          cat > "$manifest_dir/failing-bin/node" <<SH
          #!/usr/bin/env bash
          set -euo pipefail
          if [[ "\${1-}" == ".claude/dist/claude-server.js" && "\${2-}" == "--emit-hook-config" ]]; then
            "$real_node" --input-type=module -e '
              import {createHash} from "node:crypto";
              import {readFileSync} from "node:fs";
              const bytes = readFileSync(".mcp.json");
              const ownershipBytes = readFileSync(".muse-host-targets-owners.json");
              const servers = JSON.parse(bytes.toString("utf8")).mcpServers ?? {};
              const expected = ["eta-mu-claude", "eta-mu-receipt-river"];
              if (JSON.stringify(Object.keys(servers).sort()) !== JSON.stringify(expected)) process.exit(72);
              if (createHash("sha256").update(bytes).digest("hex") === "$rollback_hash") process.exit(71);
              const targets = JSON.parse(ownershipBytes.toString("utf8")).targets ?? {};
              const expectedTargets = {
                [process.env.MUSE_TEST_MCP_PRODUCER_ID + ":claude-server"]: "eta-mu-claude",
                [process.env.MUSE_TEST_MCP_PRODUCER_ID + ":mcp-server"]: "eta-mu-receipt-river",
              };
              if (JSON.stringify(targets) !== JSON.stringify(expectedTargets)) process.exit(70);
              if (createHash("sha256").update(ownershipBytes).digest("hex") === "$rollback_owners_hash") process.exit(69);
            '
            exit 73
          fi
          exec "$real_node" "\$@"
          SH
          chmod +x "$manifest_dir/failing-bin/node"
          cat > "$manifest_dir/failing-bin/mv" <<SH
          #!/usr/bin/env bash
          set -euo pipefail
          destination="\${!#}"
          printf '%s\n' "\$destination" >> "$manifest_dir/rollback-mv.log"
          if [[ "\${MUSE_TEST_FAIL_OWNERSHIP_RESTORE-}" == 1 \
                && "\$destination" == "$PWD/.muse-host-targets-owners.json" ]]; then
            ownership_count=0
            if [[ -s "$manifest_dir/ownership-mv-count" ]]; then
              IFS= read -r ownership_count < "$manifest_dir/ownership-mv-count"
            fi
            ownership_count=\$((ownership_count + 1))
            printf '%s\n' "\$ownership_count" > "$manifest_dir/ownership-mv-count"
            if [[ "\$ownership_count" -eq 2 ]]; then
              exit 74
            fi
          fi
          exec "$real_mv" "\$@"
          SH
          chmod +x "$manifest_dir/failing-bin/mv"
          set +e
          PATH="$manifest_dir/failing-bin:$PATH" \
            scripts/build-host-targets.sh claude-server 2>&1 | tee -a host-build.log
          failure_status="${PIPESTATUS[0]}"
          set -e
          if [[ "$failure_status" -ne 73 ]]; then
            echo "expected injected Claude hook exit 73; got $failure_status" >&2
            exit 1
          fi
          assert_mcp_state
          sha256sum .mcp.json > "$manifest_dir/after-failure.sha256"
          sha256sum .muse-host-targets-owners.json \
            > "$manifest_dir/after-failure-owners.sha256"
          diff -u "$manifest_dir/before-failure.sha256" "$manifest_dir/after-failure.sha256"
          diff -u \
            "$manifest_dir/before-failure-owners.sha256" \
            "$manifest_dir/after-failure-owners.sha256"
          mapfile -t rollback_publications < <(tail -n 2 "$manifest_dir/rollback-mv.log")
          test "${rollback_publications[0]}" = "$PWD/.muse-host-targets-owners.json"
          test "${rollback_publications[1]}" = "$PWD/.mcp.json"

          node --input-type=module <<'NODE'
          import {readFileSync, writeFileSync} from "node:fs";
          const registryPath = ".mcp.json";
          const registry = JSON.parse(readFileSync(registryPath, "utf8"));
          registry.mcpServers["eta-mu-retired-claude"] = {
            command: "node",
            args: [".claude/dist/retired-claude.js"],
          };
          delete registry.mcpServers["eta-mu-claude"];
          writeFileSync(registryPath, `${JSON.stringify(registry)}\n`);

          const ownershipPath = ".muse-host-targets-owners.json";
          const ownership = JSON.parse(readFileSync(ownershipPath, "utf8"));
          ownership.targets[`${process.env.MUSE_TEST_MCP_PRODUCER_ID}:claude-server`] =
            "eta-mu-retired-claude";
          writeFileSync(ownershipPath, `${JSON.stringify(ownership)}\n`);
          NODE
          : > "$manifest_dir/rollback-mv.log"
          : > "$manifest_dir/ownership-mv-count"
          set +e
          MUSE_TEST_FAIL_OWNERSHIP_RESTORE=1 \
            PATH="$manifest_dir/failing-bin:$PATH" \
            scripts/build-host-targets.sh claude-server 2>&1 | tee -a host-build.log
          ownership_failure_status="${PIPESTATUS[0]}"
          set -e
          test "$ownership_failure_status" -eq 73
          grep -Fq 'failed to restore' host-build.log
          grep -Fq 'skipped registry rollback because ownership rollback failed' host-build.log
          test "$(grep -Fxc "$PWD/.muse-host-targets-owners.json" "$manifest_dir/rollback-mv.log")" -eq 2
          test "$(grep -Fxc "$PWD/.mcp.json" "$manifest_dir/rollback-mv.log")" -eq 1
          test -f .muse-host-targets-transaction.json
          assert_mcp_state
          sha256sum .mcp.json > "$manifest_dir/after-ownership-failure.sha256"
          sha256sum .muse-host-targets-owners.json \
            > "$manifest_dir/after-ownership-failure-owners.sha256"
          diff -u "$manifest_dir/first-mcp.sha256" \
            "$manifest_dir/after-ownership-failure.sha256"
          diff -u "$manifest_dir/first-mcp-owners.sha256" \
            "$manifest_dir/after-ownership-failure-owners.sha256"

          scripts/build-host-targets.sh all 2>&1 | tee -a host-build.log
          test ! -e .muse-host-targets-transaction.json
          find src/gen -type f -print0 | sort -z | xargs -0 sha256sum \
            > "$manifest_dir/second.sha256"
          sha256sum .mcp.json > "$manifest_dir/second-mcp.sha256"
          sha256sum .muse-host-targets-owners.json \
            > "$manifest_dir/second-mcp-owners.sha256"

          diff -u "$manifest_dir/first.sha256" "$manifest_dir/second.sha256"
          diff -u "$manifest_dir/first-mcp.sha256" "$manifest_dir/second-mcp.sha256"
          diff -u \
            "$manifest_dir/first-mcp-owners.sha256" \
            "$manifest_dir/second-mcp-owners.sha256"
          if grep -Eq "$warning_pattern" host-build.log; then
            grep -E "$warning_pattern" host-build.log >&2
            exit 1
          fi

      - name: Compile and run ClojureScript tests
        run: npx shadow-cljs compile test 2>&1 | tee test.log

      - name: Verify ClojureScript assertions
        run: grep -q "0 failures, 0 errors." test.log

      - name: Upload CI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-evidence
          path: |
            host-build.log
            test.log
          if-no-files-found: error
