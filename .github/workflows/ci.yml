name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Clojure CLI
        uses: DeLaGuardo/setup-clojure@13.2
        with:
          cli: 1.12.5.1654

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install locked JavaScript dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build generated host targets from a cold checkout
        shell: bash
        run: |
          set -euo pipefail
          test ! -e src/gen
          manifest_dir="$(mktemp -d)"
          warning_pattern='(^|[[:space:]])WARNING(:|[[:space:]]+#[0-9]+([[:space:]]*-[[:space:]]*)?)'
          printf '%s\n' 'WARNING: sample' | grep -Eq "$warning_pattern"
          printf '%s\n' '------ WARNING #1 - sample' | grep -Eq "$warning_pattern"
          if printf '%s\n' 'warning-free build' | grep -Eq "$warning_pattern"; then
            echo "warning pattern matched benign text" >&2
            exit 1
          fi

          scripts/build-host-targets.sh all 2>&1 | tee host-build.log
          test -f .muse-host-targets-producer-id
          test ! -L .muse-host-targets-producer-id
          test "$(stat -c %a .muse-host-targets-producer-id)" = 600
          IFS= read -r MUSE_TEST_MCP_PRODUCER_ID < .muse-host-targets-producer-id
          [[ "$MUSE_TEST_MCP_PRODUCER_ID" =~ ^[0-9a-f]{64}$ ]]
          test "$MUSE_TEST_MCP_PRODUCER_ID" != "$(printf '0%.0s' {1..64})"
          export MUSE_TEST_MCP_PRODUCER_ID
          test "$(find src/gen -type f | wc -l)" -eq 3
          find src/gen -type f -print0 | sort -z | xargs -0 sha256sum \
            > "$manifest_dir/first.sha256"
          sha256sum .mcp.json > "$manifest_dir/first-mcp.sha256"
          sha256sum .muse-host-targets-owners.json \
            > "$manifest_dir/first-mcp-owners.sha256"
          cp .mcp.json "$manifest_dir/first-mcp.json"
          cp .muse-host-targets-owners.json "$manifest_dir/first-mcp-owners.json"

          assert_mcp_state() {
            node --input-type=module <<'NODE'
          import {readFileSync} from "node:fs";
          const config = JSON.parse(readFileSync(".mcp.json", "utf8"));
          const actual = config.mcpServers ?? {};
          const expected = {
            "eta-mu-claude": [".claude/dist/claude-server.js"],
            "eta-mu-receipt-river": [".mcp/dist/receipt-river.js"],
          };
          if (JSON.stringify(Object.keys(actual).sort()) !== JSON.stringify(Object.keys(expected).sort())) {
            throw new Error(`unexpected MCP registrations: ${Object.keys(actual).sort().join(", ")}`);
          }
          for (const [name, args] of Object.entries(expected)) {
            if (actual[name]?.command !== "node" || JSON.stringify(actual[name]?.args) !== JSON.stringify(args)) {
              throw new Error(`incorrect MCP registration: ${name}`);
            }
          }
          const ownership = JSON.parse(
            readFileSync(".muse-host-targets-owners.json", "utf8"),
          );
          const expectedOwnership = {
            [`${process.env.MUSE_TEST_MCP_PRODUCER_ID}:claude-server`]: "eta-mu-claude",
            [`${process.env.MUSE_TEST_MCP_PRODUCER_ID}:mcp-server`]: "eta-mu-receipt-river",
          };
          if (ownership.version !== 2
              || JSON.stringify(ownership.targets) !== JSON.stringify(expectedOwnership)) {
            throw new Error(`unexpected MCP target ownership: ${JSON.stringify(ownership)}`);
          }
          NODE
          }

          assert_mcp_state

          checkout_b="$manifest_dir/checkout-b"
          git worktree add --detach "$checkout_b" HEAD
          ln -s "$PWD/node_modules" "$checkout_b/node_modules"
          node --input-type=module - "$checkout_b/.ημ/config/mcp/root.edn" "$PWD/.mcp.json" <<'NODE'
          import {readFileSync, writeFileSync} from "node:fs";
          const [configPath, destination] = process.argv.slice(2);
          const source = readFileSync(configPath, "utf8");
          const changed = source
            .replace(":id                 :eta-mu/claude-receipt-river", ":id                 :eta-mu/checkout-b")
            .replace(':info {:name "eta-mu-receipt-river"', ':info {:name "eta-mu-checkout-b"')
            .replace(':mcp-config ".mcp.json"', `:mcp-config "${destination}"`);
          if (changed === source
              || !changed.includes("eta-mu-checkout-b")
              || !changed.includes(`:mcp-config "${destination}"`)) {
            throw new Error("checkout-B MCP fixture did not change config");
          }
          writeFileSync(configPath, changed);
          NODE
          node --input-type=module <<'NODE'
          import {readFileSync, writeFileSync} from "node:fs";
          const registry = JSON.parse(readFileSync(".mcp.json", "utf8"));
          registry.mcpServers["eta-mu-unowned-copy"] =
            registry.mcpServers["eta-mu-receipt-river"];
          writeFileSync(".mcp.json", `${JSON.stringify(registry, null, 2)}\n`);
          const legacyOwnership = {
            version: 1,
            targets: {
              "claude-server": "eta-mu-claude",
              "mcp-server": "eta-mu-receipt-river",
            },
          };
          writeFileSync(
            ".muse-host-targets-owners.json",
            `${JSON.stringify(legacyOwnership, null, 2)}\n`,
          );
          NODE
          (
            cd "$checkout_b"
            scripts/build-host-targets.sh mcp-server
          ) 2>&1 | tee -a host-build.log
          test -f "$checkout_b/.muse-host-targets-producer-id"
          test ! -L "$checkout_b/.muse-host-targets-producer-id"
          test "$(stat -c %a "$checkout_b/.muse-host-targets-producer-id")" = 600
          IFS= read -r checkout_b_producer_id \
            < "$checkout_b/.muse-host-targets-producer-id"
          [[ "$checkout_b_producer_id" =~ ^[0-9a-f]{64}$ ]]
          test "$checkout_b_producer_id" != "$(printf '0%.0s' {1..64})"
          test "$checkout_b_producer_id" != "$MUSE_TEST_MCP_PRODUCER_ID"
          scripts/build-host-targets.sh claude-server 2>&1 | tee -a host-build.log
          scripts/build-host-targets.sh mcp-server 2>&1 | tee -a host-build.log
          node --input-type=module - "$checkout_b_producer_id" <<'NODE'
          import {readFileSync} from "node:fs";
          const [checkoutBProducerId] = process.argv.slice(2);
          const registry = JSON.parse(readFileSync(".mcp.json", "utf8")).mcpServers ?? {};
          const expectedRegistry = [
            "eta-mu-checkout-b",
            "eta-mu-claude",
            "eta-mu-receipt-river",
            "eta-mu-unowned-copy",
          ];
          if (JSON.stringify(Object.keys(registry).sort()) !== JSON.stringify(expectedRegistry.sort())) {
            throw new Error(`shared registry lost a checkout registration: ${JSON.stringify(registry)}`);
          }
          const ownership = JSON.parse(
            readFileSync(".muse-host-targets-owners.json", "utf8"),
          );
          const targetEntries = {
            [`${process.env.MUSE_TEST_MCP_PRODUCER_ID}:claude-server`]: "eta-mu-claude",
            [`${process.env.MUSE_TEST_MCP_PRODUCER_ID}:mcp-server`]: "eta-mu-receipt-river",
            [`${checkoutBProducerId}:mcp-server`]: "eta-mu-checkout-b",
          };
          const expectedTargets = Object.fromEntries(
            Object.keys(targetEntries).sort().map((key) => [key, targetEntries[key]]),
          );
          if (ownership.version !== 2
              || JSON.stringify(ownership.targets) !== JSON.stringify(expectedTargets)) {
            throw new Error(`shared ownership lost a checkout target: ${JSON.stringify(ownership)}`);
          }
          NODE
          cp "$manifest_dir/first-mcp.json" .mcp.json
          cp "$manifest_dir/first-mcp-owners.json" .muse-host-targets-owners.json
          assert_mcp_state

          configured_dir="$manifest_dir/configured"
          configured_registry="$configured_dir/.mcp.json"
          configured_owners="$configured_dir/.muse-host-targets-owners.json"
          cp .ημ/config/mcp/root.edn "$manifest_dir/mcp-root.edn"
          node --input-type=module - "$configured_registry" <<'NODE'
          import {readFileSync, writeFileSync} from "node:fs";
          const [destination] = process.argv.slice(2);
          const path = ".ημ/config/mcp/root.edn";
          const source = readFileSync(path, "utf8");
          const changed = source.replace(
            ':mcp-config ".mcp.json"',
            `:mcp-config "${destination}"`,
          );
          if (changed === source) throw new Error("MCP destination fixture did not change config");
          writeFileSync(path, changed);
          NODE

          configured_lock="$configured_dir/.muse-host-targets.lock"
          mkdir -p "$configured_dir"
          mkdir "$configured_lock"
          printf '%s\n' "$$" > "$configured_lock/owner"
          set +e
          scripts/build-host-targets.sh mcp-server \
            > "$manifest_dir/configured-lock-build.log" 2>&1
          configured_lock_status="$?"
          set -e
          test "$configured_lock_status" -eq 64
          grep -Fq "another MCP-producing build is active (pid $$)" \
            "$manifest_dir/configured-lock-build.log"
          if grep -Fq '[muse host build] generating' \
            "$manifest_dir/configured-lock-build.log"; then
            cat "$manifest_dir/configured-lock-build.log" >&2
            exit 1
          fi
          test "$(cat "$configured_lock/owner")" = "$$"
          unlink "$configured_lock/owner"
          rmdir "$configured_lock"
          cat "$manifest_dir/configured-lock-build.log" >> host-build.log

          scripts/build-host-targets.sh mcp-server 2>&1 | tee -a host-build.log
          node --input-type=module - "$configured_registry" "$configured_owners" <<'NODE'
          import {readFileSync} from "node:fs";
          const [registryPath, ownershipPath] = process.argv.slice(2);
          const registry = JSON.parse(readFileSync(registryPath, "utf8")).mcpServers ?? {};
          const expectedRegistry = {
            "eta-mu-receipt-river": {
              command: "node",
              args: [".mcp/dist/receipt-river.js"],
            },
          };
          if (JSON.stringify(registry) !== JSON.stringify(expectedRegistry)) {
            throw new Error(`unexpected configured registry: ${JSON.stringify(registry)}`);
          }
          const ownership = JSON.parse(readFileSync(ownershipPath, "utf8"));
          const expectedOwnership = {
            version: 2,
            targets: {
              [`${process.env.MUSE_TEST_MCP_PRODUCER_ID}:mcp-server`]: "eta-mu-receipt-river",
            },
          };
          if (JSON.stringify(ownership) !== JSON.stringify(expectedOwnership)) {
            throw new Error(`unexpected configured ownership: ${JSON.stringify(ownership)}`);
          }
          NODE
          assert_mcp_state
          sha256sum .mcp.json > "$manifest_dir/after-configured-destination.sha256"
          diff -u "$manifest_dir/first-mcp.sha256" \
            "$manifest_dir/after-configured-destination.sha256"
          cp "$manifest_dir/mcp-root.edn" .ημ/config/mcp/root.edn

          linked_registry="$manifest_dir/linked-mcp.json"
          linked_owners="$linked_registry.muse-host-targets-owners.json"
          cp .mcp.json "$linked_registry"
          cp .muse-host-targets-owners.json "$linked_owners"
          chmod 0640 "$linked_registry"
          chmod 0660 "$linked_owners"
          touch -d @946684800 "$linked_registry" "$linked_owners"
          python3 - "$linked_registry" "$linked_owners" \
            "$manifest_dir/linked-registry.acl" \
            "$manifest_dir/linked-owners.acl" <<'PY'
          import ctypes
          import os
          import sys

          registry, owners, registry_acl, owners_acl = sys.argv[1:]
          acl = ctypes.CDLL("libacl.so.1", use_errno=True)
          acl.acl_from_text.argtypes = [ctypes.c_char_p]
          acl.acl_from_text.restype = ctypes.c_void_p
          acl.acl_set_file.argtypes = [ctypes.c_char_p, ctypes.c_int, ctypes.c_void_p]
          acl.acl_set_file.restype = ctypes.c_int
          acl.acl_free.argtypes = [ctypes.c_void_p]

          fixtures = (
              (registry, registry_acl, b"u::rw-,u:nobody:r--,g::r--,m::r--,o::---"),
              (owners, owners_acl, b"u::rw-,u:nobody:r--,g::rw-,m::rw-,o::---"),
          )
          for path, snapshot, text in fixtures:
              value = acl.acl_from_text(text)
              if not value:
                  raise RuntimeError("could not allocate the POSIX ACL fixture")
              try:
                  if acl.acl_set_file(path.encode(), 0x8000, value) != 0:
                      error = ctypes.get_errno()
                      raise OSError(error, os.strerror(error), path)
              finally:
                  acl.acl_free(value)
              with open(snapshot, "wb") as output:
                  output.write(os.getxattr(path, "system.posix_acl_access"))
          PY
          unlink .mcp.json
          unlink .muse-host-targets-owners.json
          ln -s "$linked_registry" .mcp.json
          ln -s "$linked_owners" .muse-host-targets-owners.json
          linked_registry_inode="$(stat -c %i "$linked_registry")"
          linked_owners_inode="$(stat -c %i "$linked_owners")"

          scripts/build-host-targets.sh mcp-server 2>&1 | tee -a host-build.log
          assert_mcp_state
          test -L .mcp.json
          test -L .muse-host-targets-owners.json
          test "$(readlink .mcp.json)" = "$linked_registry"
          test "$(readlink .muse-host-targets-owners.json)" = "$linked_owners"
          test "$(stat -c %i "$linked_registry")" != "$linked_registry_inode"
          test "$(stat -c %i "$linked_owners")" != "$linked_owners_inode"
          test "$(stat -c %a "$linked_registry")" = 640
          test "$(stat -c %a "$linked_owners")" = 660
          test "$(stat -c %Y "$linked_registry")" != 946684800
          test "$(stat -c %Y "$linked_owners")" != 946684800
          python3 - "$linked_registry" "$linked_owners" \
            "$manifest_dir/linked-registry.acl" \
            "$manifest_dir/linked-owners.acl" <<'PY'
          import os
          import sys

          registry, owners, registry_acl, owners_acl = sys.argv[1:]
          for path, snapshot in ((registry, registry_acl), (owners, owners_acl)):
              with open(snapshot, "rb") as expected:
                  if os.getxattr(path, "system.posix_acl_access") != expected.read():
                      raise RuntimeError(f"POSIX ACL changed during atomic replacement: {path}")
          PY

          unlink .mcp.json
          unlink .muse-host-targets-owners.json
          cp "$linked_registry" .mcp.json
          cp "$linked_owners" .muse-host-targets-owners.json

          cp .ημ/config/mcp/root.edn "$manifest_dir/relative-mcp-root.edn"
          node --input-type=module - "$PWD/.mcp.json" <<'NODE'
          import {readFileSync, writeFileSync} from "node:fs";
          const [destination] = process.argv.slice(2);
          const path = ".ημ/config/mcp/root.edn";
          const source = readFileSync(path, "utf8");
          const changed = source.replace(
            ':mcp-config ".mcp.json"',
            `:mcp-config "${destination}"`,
          );
          if (changed === source) throw new Error("absolute MCP alias fixture did not change config");
          writeFileSync(path, changed);
          NODE
          mkdir .muse-host-targets.lock
          printf '%s\n' "$$" > .muse-host-targets.lock/owner
          set +e
          scripts/build-host-targets.sh all \
            > "$manifest_dir/lock-build.log" 2>&1
          lock_status="$?"
          set -e
          test "$lock_status" -eq 64
          grep -Fq "another MCP-producing build is active (pid $$)" \
            "$manifest_dir/lock-build.log"
          if grep -Fq '[muse host build] generating' "$manifest_dir/lock-build.log"; then
            cat "$manifest_dir/lock-build.log" >&2
            exit 1
          fi
          test "$(cat .muse-host-targets.lock/owner)" = "$$"
          rm .muse-host-targets.lock/owner
          rmdir .muse-host-targets.lock
          cat "$manifest_dir/lock-build.log" >> host-build.log
          cp "$manifest_dir/relative-mcp-root.edn" .ημ/config/mcp/root.edn

          mkdir .muse-host-targets.lock
          printf '%s\n' '99999999' > .muse-host-targets.lock/owner
          set +e
          scripts/build-host-targets.sh mcp-server \
            > "$manifest_dir/stale-lock-build.log" 2>&1
          stale_lock_status="$?"
          set -e
          test "$stale_lock_status" -eq 64
          grep -Fq "stale MCP build lock owned by dead pid 99999999" \
            "$manifest_dir/stale-lock-build.log"
          if grep -Fq '[muse host build] generating' "$manifest_dir/stale-lock-build.log"; then
            cat "$manifest_dir/stale-lock-build.log" >&2
            exit 1
          fi
          test "$(cat .muse-host-targets.lock/owner)" = '99999999'
          rm .muse-host-targets.lock/owner
          rmdir .muse-host-targets.lock
          cat "$manifest_dir/stale-lock-build.log" >> host-build.log

          node --input-type=module <<'NODE'
          import {readFileSync, writeFileSync} from "node:fs";
          const configPath = ".mcp.json";
          const config = JSON.parse(readFileSync(configPath, "utf8"));
          config.mcpServers["eta-mu-retired"] = {
            command: "node",
            args: [".mcp/dist/retired-server.js"],
          };
          delete config.mcpServers["eta-mu-receipt-river"];
          writeFileSync(configPath, `${JSON.stringify(config, null, 2)}\n`);

          const ownershipPath = ".muse-host-targets-owners.json";
          const ownership = JSON.parse(readFileSync(ownershipPath, "utf8"));
          ownership.targets[`${process.env.MUSE_TEST_MCP_PRODUCER_ID}:mcp-server`] =
            "eta-mu-retired";
          writeFileSync(ownershipPath, `${JSON.stringify(ownership, null, 2)}\n`);
          NODE

          registry_inode_before="$(stat -c %i .mcp.json)"
          owners_inode_before="$(stat -c %i .muse-host-targets-owners.json)"
          real_clojure="$(command -v clojure)"
          real_mv="$(command -v mv)"
          real_node="$(command -v node)"
          mkdir "$manifest_dir/crash-bin"
          cat > "$manifest_dir/crash-bin/mv" <<SH
          #!/usr/bin/env bash
          set -euo pipefail
          destination="\${!#}"
          if [[ "\${MUSE_TEST_CRASH_AFTER_REGISTRY-}" == 1 \
                && "\$destination" == "$PWD/.mcp.json" ]]; then
            "$real_mv" "\$@"
            kill -KILL "\$PPID"
            exit 137
          fi
          exec "$real_mv" "\$@"
          SH
          chmod +x "$manifest_dir/crash-bin/mv"
          set +e
          MUSE_TEST_CRASH_AFTER_REGISTRY=1 \
            PATH="$manifest_dir/crash-bin:$PATH" \
            scripts/build-host-targets.sh mcp-server 2>&1 | tee -a host-build.log
          crash_status="${PIPESTATUS[0]}"
          set -e
          test "$crash_status" -eq 137
          test -f .muse-host-targets-transaction.json
          test ! -L .muse-host-targets-transaction.json
          test "$(stat -c %a .muse-host-targets-transaction.json)" = 600
          test -d .muse-host-targets.lock
          IFS= read -r crashed_owner < .muse-host-targets.lock/owner
          if kill -0 "$crashed_owner" 2>/dev/null; then
            echo "crash-injected MCP build owner is still active: $crashed_owner" >&2
            exit 1
          fi
          node --input-type=module <<'NODE'
          import {readFileSync} from "node:fs";
          const registry = JSON.parse(readFileSync(".mcp.json", "utf8")).mcpServers ?? {};
          const expectedRegistry = ["eta-mu-claude", "eta-mu-receipt-river"];
          if (JSON.stringify(Object.keys(registry).sort()) !== JSON.stringify(expectedRegistry)) {
            throw new Error(`crash did not occur after the canonical registry rename: ${JSON.stringify(registry)}`);
          }
          const ownership = JSON.parse(
            readFileSync(".muse-host-targets-owners.json", "utf8"),
          ).targets ?? {};
          const ownershipKey = `${process.env.MUSE_TEST_MCP_PRODUCER_ID}:mcp-server`;
          if (ownership[ownershipKey] !== "eta-mu-retired") {
            throw new Error(`crash did not preserve the old ownership state: ${JSON.stringify(ownership)}`);
          }
          NODE
          rm .muse-host-targets.lock/owner
          rmdir .muse-host-targets.lock

          mkdir "$manifest_dir/recovery-bin"
          cat > "$manifest_dir/recovery-bin/clojure" <<SH
          #!/usr/bin/env bash
          set -euo pipefail
          if [[ " \$* " == *"eta-mu.mcp.build/generate-entrypoint"* ]]; then
            "$real_node" --input-type=module <<'NODE'
          import {existsSync, readFileSync} from "node:fs";
          if (existsSync(".muse-host-targets-transaction.json")) {
            throw new Error("MCP transaction marker still exists at generator invocation");
          }
          const registry = JSON.parse(readFileSync(".mcp.json", "utf8")).mcpServers ?? {};
          const expectedRegistry = ["eta-mu-claude", "eta-mu-receipt-river"];
          if (JSON.stringify(Object.keys(registry).sort()) !== JSON.stringify(expectedRegistry)) {
            throw new Error("MCP registry was not recovered before generation: " + JSON.stringify(registry));
          }
          const ownership = JSON.parse(
            readFileSync(".muse-host-targets-owners.json", "utf8"),
          );
          const expectedOwnership = {
            version: 2,
            targets: {
              [process.env.MUSE_TEST_MCP_PRODUCER_ID + ":claude-server"]: "eta-mu-claude",
              [process.env.MUSE_TEST_MCP_PRODUCER_ID + ":mcp-server"]: "eta-mu-receipt-river",
            },
          };
          if (JSON.stringify(ownership) !== JSON.stringify(expectedOwnership)) {
            throw new Error("MCP ownership was not recovered before generation: " + JSON.stringify(ownership));
          }
          NODE
            exit 75
          fi
          exec "$real_clojure" "\$@"
          SH
          chmod +x "$manifest_dir/recovery-bin/clojure"
          set +e
          PATH="$manifest_dir/recovery-bin:$PATH" \
            scripts/build-host-targets.sh mcp-server 2>&1 | tee -a host-build.log
          recovery_status="${PIPESTATUS[0]}"
          set -e
          test "$recovery_status" -eq 75
          grep -Fq 'recovering interrupted MCP state transaction' host-build.log
          test ! -e .muse-host-targets-transaction.json
          test ! -e .muse-host-targets.lock
          assert_mcp_state
          test "$(stat -c %i .mcp.json)" != "$registry_inode_before"
          test "$(stat -c %i .muse-host-targets-owners.json)" != "$owners_inode_before"
          sha256sum .mcp.json > "$manifest_dir/after-mcp.sha256"
          sha256sum .muse-host-targets-owners.json \
            > "$manifest_dir/after-mcp-owners.sha256"
          diff -u "$manifest_dir/first-mcp.sha256" "$manifest_dir/after-mcp.sha256"
          diff -u \
            "$manifest_dir/first-mcp-owners.sha256" \
            "$manifest_dir/after-mcp-owners.sha256"

          node --input-type=module - "$manifest_dir/reader.stop" <<'NODE' &
          import {existsSync, readFileSync} from "node:fs";
          const [stopPath] = process.argv.slice(2);
          const waitState = new Int32Array(new SharedArrayBuffer(4));
          const expected = ["eta-mu-claude", "eta-mu-receipt-river"];
          while (!existsSync(stopPath)) {
            const servers = JSON.parse(readFileSync(".mcp.json", "utf8")).mcpServers ?? {};
            if (JSON.stringify(Object.keys(servers).sort()) !== JSON.stringify(expected)) {
              throw new Error(`reader observed transient MCP state: ${Object.keys(servers).sort()}`);
            }
            Atomics.wait(waitState, 0, 0, 1);
          }
          NODE
          reader_pid="$!"
          registry_inode_before="$(stat -c %i .mcp.json)"
          owners_inode_before="$(stat -c %i .muse-host-targets-owners.json)"
          set +e
          scripts/build-host-targets.sh claude-server 2>&1 | tee -a host-build.log
          claude_status="${PIPESTATUS[0]}"
          touch "$manifest_dir/reader.stop"
          wait "$reader_pid"
          reader_status="$?"
          set -e
          test "$claude_status" -eq 0
          test "$reader_status" -eq 0
          assert_mcp_state
          test "$(stat -c %i .mcp.json)" != "$registry_inode_before"
          test "$(stat -c %i .muse-host-targets-owners.json)" != "$owners_inode_before"
          sha256sum .mcp.json > "$manifest_dir/after-claude.sha256"
          sha256sum .muse-host-targets-owners.json \
            > "$manifest_dir/after-claude-owners.sha256"
          diff -u "$manifest_dir/first-mcp.sha256" "$manifest_dir/after-claude.sha256"
          diff -u \
            "$manifest_dir/first-mcp-owners.sha256" \
            "$manifest_dir/after-claude-owners.sha256"

          node --input-type=module <<'NODE'
          import {readFileSync, writeFileSync} from "node:fs";
          for (const path of [".mcp.json", ".muse-host-targets-owners.json"]) {
            writeFileSync(path, `${JSON.stringify(JSON.parse(readFileSync(path, "utf8")))}\n`);
          }
          NODE
          sha256sum .mcp.json > "$manifest_dir/before-failure.sha256"
          sha256sum .muse-host-targets-owners.json \
            > "$manifest_dir/before-failure-owners.sha256"
          rollback_hash="$(cut -d ' ' -f 1 "$manifest_dir/before-failure.sha256")"
          rollback_owners_hash="$(cut -d ' ' -f 1 "$manifest_dir/before-failure-owners.sha256")"
          real_node="$(command -v node)"
          real_mv="$(command -v mv)"
          mkdir "$manifest_dir/failing-bin"
          cat > "$manifest_dir/failing-bin/node" <<SH
          #!/usr/bin/env bash
          set -euo pipefail
          if [[ "\${1-}" == ".claude/dist/claude-server.js" && "\${2-}" == "--emit-hook-config" ]]; then
            "$real_node" --input-type=module -e '
              import {createHash} from "node:crypto";
              import {readFileSync} from "node:fs";
              const bytes = readFileSync(".mcp.json");
              const ownershipBytes = readFileSync(".muse-host-targets-owners.json");
              const servers = JSON.parse(bytes.toString("utf8")).mcpServers ?? {};
              const expected = ["eta-mu-claude", "eta-mu-receipt-river"];
              if (JSON.stringify(Object.keys(servers).sort()) !== JSON.stringify(expected)) process.exit(72);
              if (createHash("sha256").update(bytes).digest("hex") === "$rollback_hash") process.exit(71);
              const targets = JSON.parse(ownershipBytes.toString("utf8")).targets ?? {};
              const expectedTargets = {
                [process.env.MUSE_TEST_MCP_PRODUCER_ID + ":claude-server"]: "eta-mu-claude",
                [process.env.MUSE_TEST_MCP_PRODUCER_ID + ":mcp-server"]: "eta-mu-receipt-river",
              };
              if (JSON.stringify(targets) !== JSON.stringify(expectedTargets)) process.exit(70);
              if (createHash("sha256").update(ownershipBytes).digest("hex") === "$rollback_owners_hash") process.exit(69);
            '
            exit 73
          fi
          exec "$real_node" "\$@"
          SH
          chmod +x "$manifest_dir/failing-bin/node"
          cat > "$manifest_dir/failing-bin/mv" <<SH
          #!/usr/bin/env bash
          set -euo pipefail
          destination="\${!#}"
          printf '%s\n' "\$destination" >> "$manifest_dir/rollback-mv.log"
          if [[ "\${MUSE_TEST_FAIL_OWNERSHIP_RESTORE-}" == 1 \
                && "\$destination" == "$PWD/.muse-host-targets-owners.json" ]]; then
            ownership_count=0
            if [[ -s "$manifest_dir/ownership-mv-count" ]]; then
              IFS= read -r ownership_count < "$manifest_dir/ownership-mv-count"
            fi
            ownership_count=\$((ownership_count + 1))
            printf '%s\n' "\$ownership_count" > "$manifest_dir/ownership-mv-count"
            if [[ "\$ownership_count" -eq 2 ]]; then
              exit 74
            fi
          fi
          exec "$real_mv" "\$@"
          SH
          chmod +x "$manifest_dir/failing-bin/mv"
          set +e
          PATH="$manifest_dir/failing-bin:$PATH" \
            scripts/build-host-targets.sh claude-server 2>&1 | tee -a host-build.log
          failure_status="${PIPESTATUS[0]}"
          set -e
          if [[ "$failure_status" -ne 73 ]]; then
            echo "expected injected Claude hook exit 73; got $failure_status" >&2
            exit 1
          fi
          assert_mcp_state
          sha256sum .mcp.json > "$manifest_dir/after-failure.sha256"
          sha256sum .muse-host-targets-owners.json \
            > "$manifest_dir/after-failure-owners.sha256"
          diff -u "$manifest_dir/before-failure.sha256" "$manifest_dir/after-failure.sha256"
          diff -u \
            "$manifest_dir/before-failure-owners.sha256" \
            "$manifest_dir/after-failure-owners.sha256"
          mapfile -t rollback_publications < <(tail -n 2 "$manifest_dir/rollback-mv.log")
          test "${rollback_publications[0]}" = "$PWD/.muse-host-targets-owners.json"
          test "${rollback_publications[1]}" = "$PWD/.mcp.json"

          node --input-type=module <<'NODE'
          import {readFileSync, writeFileSync} from "node:fs";
          const registryPath = ".mcp.json";
          const registry = JSON.parse(readFileSync(registryPath, "utf8"));
          registry.mcpServers["eta-mu-retired-claude"] = {
            command: "node",
            args: [".claude/dist/retired-claude.js"],
          };
          delete registry.mcpServers["eta-mu-claude"];
          writeFileSync(registryPath, `${JSON.stringify(registry)}\n`);

          const ownershipPath = ".muse-host-targets-owners.json";
          const ownership = JSON.parse(readFileSync(ownershipPath, "utf8"));
          ownership.targets[`${process.env.MUSE_TEST_MCP_PRODUCER_ID}:claude-server`] =
            "eta-mu-retired-claude";
          writeFileSync(ownershipPath, `${JSON.stringify(ownership)}\n`);
          NODE
          : > "$manifest_dir/rollback-mv.log"
          : > "$manifest_dir/ownership-mv-count"
          set +e
          MUSE_TEST_FAIL_OWNERSHIP_RESTORE=1 \
            PATH="$manifest_dir/failing-bin:$PATH" \
            scripts/build-host-targets.sh claude-server 2>&1 | tee -a host-build.log
          ownership_failure_status="${PIPESTATUS[0]}"
          set -e
          test "$ownership_failure_status" -eq 73
          grep -Fq 'failed to restore' host-build.log
          grep -Fq 'skipped registry rollback because ownership rollback failed' host-build.log
          test "$(grep -Fxc "$PWD/.muse-host-targets-owners.json" "$manifest_dir/rollback-mv.log")" -eq 2
          test "$(grep -Fxc "$PWD/.mcp.json" "$manifest_dir/rollback-mv.log")" -eq 1
          test -f .muse-host-targets-transaction.json
          assert_mcp_state
          sha256sum .mcp.json > "$manifest_dir/after-ownership-failure.sha256"
          sha256sum .muse-host-targets-owners.json \
            > "$manifest_dir/after-ownership-failure-owners.sha256"
          diff -u "$manifest_dir/first-mcp.sha256" \
            "$manifest_dir/after-ownership-failure.sha256"
          diff -u "$manifest_dir/first-mcp-owners.sha256" \
            "$manifest_dir/after-ownership-failure-owners.sha256"

          scripts/build-host-targets.sh all 2>&1 | tee -a host-build.log
          test ! -e .muse-host-targets-transaction.json
          find src/gen -type f -print0 | sort -z | xargs -0 sha256sum \
            > "$manifest_dir/second.sha256"
          sha256sum .mcp.json > "$manifest_dir/second-mcp.sha256"
          sha256sum .muse-host-targets-owners.json \
            > "$manifest_dir/second-mcp-owners.sha256"

          diff -u "$manifest_dir/first.sha256" "$manifest_dir/second.sha256"
          diff -u "$manifest_dir/first-mcp.sha256" "$manifest_dir/second-mcp.sha256"
          diff -u \
            "$manifest_dir/first-mcp-owners.sha256" \
            "$manifest_dir/second-mcp-owners.sha256"
          if grep -Eq "$warning_pattern" host-build.log; then
            grep -E "$warning_pattern" host-build.log >&2
            exit 1
          fi

      - name: Compile and run ClojureScript tests
        run: npx shadow-cljs compile test 2>&1 | tee test.log

      - name: Verify ClojureScript assertions
        run: grep -q "0 failures, 0 errors." test.log

      - name: Upload CI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-evidence
          path: |
            host-build.log
            test.log
          if-no-files-found: error
