name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Clojure CLI
        uses: DeLaGuardo/setup-clojure@13.2
        with:
          cli: 1.12.5.1654
          clj-kondo: 2026.08.04

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install locked JavaScript dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Compile and run ClojureScript tests
        run: npm test 2>&1 | tee test.log

      - name: Build all Muse host targets
        run: npm run build

      - name: Verify each declared host builds from a cold checkout
        run: npm run test:build-cold

      - name: Lint Clojure sources and tests
        run: npm run lint

      - name: Verify ClojureScript assertions
        run: grep -q "0 failures, 0 errors." test.log

      - name: Upload CI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-evidence
          path: test.log
          if-no-files-found: error
