name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Clojure CLI
        uses: DeLaGuardo/setup-clojure@13.2
        with:
          cli: 1.12.5.1654

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install locked JavaScript dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build generated host targets from a cold checkout
        shell: bash
        run: |
          set -euo pipefail
          test ! -e src/gen
          manifest_dir="$(mktemp -d)"

          scripts/build-host-targets.sh all 2>&1 | tee host-build.log
          test "$(find src/gen -type f | wc -l)" -eq 3
          find src/gen -type f -print0 | sort -z | xargs -0 sha256sum \
            > "$manifest_dir/first.sha256"

          scripts/build-host-targets.sh all 2>&1 | tee -a host-build.log
          find src/gen -type f -print0 | sort -z | xargs -0 sha256sum \
            > "$manifest_dir/second.sha256"

          diff -u "$manifest_dir/first.sha256" "$manifest_dir/second.sha256"
          if grep -Eq '(^|[[:space:]])WARNING:' host-build.log; then
            grep -E '(^|[[:space:]])WARNING:' host-build.log >&2
            exit 1
          fi

      - name: Compile and run ClojureScript tests
        run: npx shadow-cljs compile test 2>&1 | tee test.log

      - name: Verify ClojureScript assertions
        run: grep -q "0 failures, 0 errors." test.log

      - name: Upload CI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-evidence
          path: |
            host-build.log
            test.log
          if-no-files-found: error
