name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Clojure CLI
        uses: DeLaGuardo/setup-clojure@13.2
        with:
          cli: 1.12.5.1654

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install locked JavaScript dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build generated host targets from a cold checkout
        shell: bash
        run: |
          set -euo pipefail
          test ! -e src/gen
          manifest_dir="$(mktemp -d)"
          warning_pattern='(^|[[:space:]])WARNING(:|[[:space:]]+#[0-9]+([[:space:]]*-[[:space:]]*)?)'
          printf '%s\n' 'WARNING: sample' '------ WARNING #1 - sample' \
            | grep -Eq "$warning_pattern"

          scripts/build-host-targets.sh all 2>&1 | tee host-build.log
          test "$(find src/gen -type f | wc -l)" -eq 3
          find src/gen -type f -print0 | sort -z | xargs -0 sha256sum \
            > "$manifest_dir/first.sha256"
          sha256sum .mcp.json > "$manifest_dir/first-mcp.sha256"

          assert_mcp_registry() {
            node --input-type=module <<'NODE'
          import {readFileSync} from "node:fs";
          const config = JSON.parse(readFileSync(".mcp.json", "utf8"));
          const actual = config.mcpServers ?? {};
          const expected = {
            "eta-mu-claude": [".claude/dist/claude-server.js"],
            "eta-mu-receipt-river": [".mcp/dist/receipt-river.js"],
          };
          if (JSON.stringify(Object.keys(actual).sort()) !== JSON.stringify(Object.keys(expected).sort())) {
            throw new Error(`unexpected MCP registrations: ${Object.keys(actual).sort().join(", ")}`);
          }
          for (const [name, args] of Object.entries(expected)) {
            if (actual[name]?.command !== "node" || JSON.stringify(actual[name]?.args) !== JSON.stringify(args)) {
              throw new Error(`incorrect MCP registration: ${name}`);
            }
          }
          NODE
          }

          assert_mcp_registry

          node --input-type=module <<'NODE'
          import {readFileSync, writeFileSync} from "node:fs";
          const path = ".mcp.json";
          const config = JSON.parse(readFileSync(path, "utf8"));
          config.mcpServers["eta-mu-retired"] = config.mcpServers["eta-mu-receipt-river"];
          delete config.mcpServers["eta-mu-receipt-river"];
          writeFileSync(path, `${JSON.stringify(config, null, 2)}\n`);
          NODE

          scripts/build-host-targets.sh mcp-server 2>&1 | tee -a host-build.log
          assert_mcp_registry
          sha256sum .mcp.json > "$manifest_dir/after-mcp.sha256"
          diff -u "$manifest_dir/first-mcp.sha256" "$manifest_dir/after-mcp.sha256"

          scripts/build-host-targets.sh claude-server 2>&1 | tee -a host-build.log
          assert_mcp_registry
          sha256sum .mcp.json > "$manifest_dir/after-claude.sha256"
          diff -u "$manifest_dir/first-mcp.sha256" "$manifest_dir/after-claude.sha256"

          real_node="$(command -v node)"
          mkdir "$manifest_dir/failing-bin"
          cat > "$manifest_dir/failing-bin/node" <<SH
          #!/usr/bin/env bash
          if [[ "\${1-}" == ".claude/dist/claude-server.js" && "\${2-}" == "--emit-hook-config" ]]; then
            exit 73
          fi
          exec "$real_node" "\$@"
          SH
          chmod +x "$manifest_dir/failing-bin/node"
          if PATH="$manifest_dir/failing-bin:$PATH" \
            scripts/build-host-targets.sh claude-server 2>&1 | tee -a host-build.log; then
            echo "expected injected Claude hook failure" >&2
            exit 1
          fi
          assert_mcp_registry
          sha256sum .mcp.json > "$manifest_dir/after-failure.sha256"
          diff -u "$manifest_dir/first-mcp.sha256" "$manifest_dir/after-failure.sha256"

          scripts/build-host-targets.sh all 2>&1 | tee -a host-build.log
          find src/gen -type f -print0 | sort -z | xargs -0 sha256sum \
            > "$manifest_dir/second.sha256"
          sha256sum .mcp.json > "$manifest_dir/second-mcp.sha256"

          diff -u "$manifest_dir/first.sha256" "$manifest_dir/second.sha256"
          diff -u "$manifest_dir/first-mcp.sha256" "$manifest_dir/second-mcp.sha256"
          if grep -Eq "$warning_pattern" host-build.log; then
            grep -E "$warning_pattern" host-build.log >&2
            exit 1
          fi

      - name: Compile and run ClojureScript tests
        run: npx shadow-cljs compile test 2>&1 | tee test.log

      - name: Verify ClojureScript assertions
        run: grep -q "0 failures, 0 errors." test.log

      - name: Upload CI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-evidence
          path: |
            host-build.log
            test.log
          if-no-files-found: error
