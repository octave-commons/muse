name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Clojure CLI
        uses: DeLaGuardo/setup-clojure@13.2
        with:
          cli: 1.12.5.1654

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install locked JavaScript dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build generated host targets from a cold checkout
        shell: bash
        run: |
          set -euo pipefail
          test ! -e src/gen
          manifest_dir="$(mktemp -d)"
          warning_pattern='(^|[[:space:]])WARNING(:|[[:space:]]+#[0-9]+([[:space:]]*-[[:space:]]*)?)'
          printf '%s\n' 'WARNING: sample' | grep -Eq "$warning_pattern"
          printf '%s\n' '------ WARNING #1 - sample' | grep -Eq "$warning_pattern"
          if printf '%s\n' 'warning-free build' | grep -Eq "$warning_pattern"; then
            echo "warning pattern matched benign text" >&2
            exit 1
          fi

          scripts/build-host-targets.sh all 2>&1 | tee host-build.log
          test "$(find src/gen -type f | wc -l)" -eq 3
          find src/gen -type f -print0 | sort -z | xargs -0 sha256sum \
            > "$manifest_dir/first.sha256"
          sha256sum .mcp.json > "$manifest_dir/first-mcp.sha256"
          sha256sum .muse-host-targets-owners.json \
            > "$manifest_dir/first-mcp-owners.sha256"

          assert_mcp_state() {
            node --input-type=module <<'NODE'
          import {readFileSync} from "node:fs";
          const config = JSON.parse(readFileSync(".mcp.json", "utf8"));
          const actual = config.mcpServers ?? {};
          const expected = {
            "eta-mu-claude": [".claude/dist/claude-server.js"],
            "eta-mu-receipt-river": [".mcp/dist/receipt-river.js"],
          };
          if (JSON.stringify(Object.keys(actual).sort()) !== JSON.stringify(Object.keys(expected).sort())) {
            throw new Error(`unexpected MCP registrations: ${Object.keys(actual).sort().join(", ")}`);
          }
          for (const [name, args] of Object.entries(expected)) {
            if (actual[name]?.command !== "node" || JSON.stringify(actual[name]?.args) !== JSON.stringify(args)) {
              throw new Error(`incorrect MCP registration: ${name}`);
            }
          }
          const ownership = JSON.parse(
            readFileSync(".muse-host-targets-owners.json", "utf8"),
          );
          const expectedOwnership = {
            "claude-server": "eta-mu-claude",
            "mcp-server": "eta-mu-receipt-river",
          };
          if (ownership.version !== 1
              || JSON.stringify(ownership.targets) !== JSON.stringify(expectedOwnership)) {
            throw new Error(`unexpected MCP target ownership: ${JSON.stringify(ownership)}`);
          }
          NODE
          }

          assert_mcp_state

          linked_registry="$manifest_dir/linked-mcp.json"
          linked_owners="$manifest_dir/linked-mcp-owners.json"
          cp .mcp.json "$linked_registry"
          cp .muse-host-targets-owners.json "$linked_owners"
          unlink .mcp.json
          unlink .muse-host-targets-owners.json
          ln -s "$linked_registry" .mcp.json
          ln -s "$linked_owners" .muse-host-targets-owners.json
          linked_registry_inode="$(stat -c %i "$linked_registry")"
          linked_owners_inode="$(stat -c %i "$linked_owners")"

          scripts/build-host-targets.sh mcp-server 2>&1 | tee -a host-build.log
          assert_mcp_state
          test -L .mcp.json
          test -L .muse-host-targets-owners.json
          test "$(readlink .mcp.json)" = "$linked_registry"
          test "$(readlink .muse-host-targets-owners.json)" = "$linked_owners"
          test "$(stat -c %i "$linked_registry")" != "$linked_registry_inode"
          test "$(stat -c %i "$linked_owners")" != "$linked_owners_inode"

          unlink .mcp.json
          unlink .muse-host-targets-owners.json
          cp "$linked_registry" .mcp.json
          cp "$linked_owners" .muse-host-targets-owners.json

          mkdir .muse-host-targets.lock
          printf '%s\n' "$$" > .muse-host-targets.lock/owner
          set +e
          scripts/build-host-targets.sh mcp-server \
            > "$manifest_dir/lock-build.log" 2>&1
          lock_status="$?"
          set -e
          test "$lock_status" -eq 64
          grep -Fq "another MCP-producing build is active (pid $$)" \
            "$manifest_dir/lock-build.log"
          if grep -Fq '[muse host build] generating' "$manifest_dir/lock-build.log"; then
            cat "$manifest_dir/lock-build.log" >&2
            exit 1
          fi
          test "$(cat .muse-host-targets.lock/owner)" = "$$"
          rm .muse-host-targets.lock/owner
          rmdir .muse-host-targets.lock
          cat "$manifest_dir/lock-build.log" >> host-build.log

          mkdir .muse-host-targets.lock
          printf '%s\n' '99999999' > .muse-host-targets.lock/owner
          set +e
          scripts/build-host-targets.sh mcp-server \
            > "$manifest_dir/stale-lock-build.log" 2>&1
          stale_lock_status="$?"
          set -e
          test "$stale_lock_status" -eq 64
          grep -Fq "stale MCP build lock owned by dead pid 99999999" \
            "$manifest_dir/stale-lock-build.log"
          if grep -Fq '[muse host build] generating' "$manifest_dir/stale-lock-build.log"; then
            cat "$manifest_dir/stale-lock-build.log" >&2
            exit 1
          fi
          test "$(cat .muse-host-targets.lock/owner)" = '99999999'
          rm .muse-host-targets.lock/owner
          rmdir .muse-host-targets.lock
          cat "$manifest_dir/stale-lock-build.log" >> host-build.log

          node --input-type=module <<'NODE'
          import {readFileSync, writeFileSync} from "node:fs";
          const configPath = ".mcp.json";
          const config = JSON.parse(readFileSync(configPath, "utf8"));
          config.mcpServers["eta-mu-retired"] = {
            command: "node",
            args: [".mcp/dist/retired-server.js"],
          };
          delete config.mcpServers["eta-mu-receipt-river"];
          writeFileSync(configPath, `${JSON.stringify(config, null, 2)}\n`);

          const ownershipPath = ".muse-host-targets-owners.json";
          const ownership = JSON.parse(readFileSync(ownershipPath, "utf8"));
          ownership.targets["mcp-server"] = "eta-mu-retired";
          writeFileSync(ownershipPath, `${JSON.stringify(ownership, null, 2)}\n`);
          NODE

          registry_inode_before="$(stat -c %i .mcp.json)"
          owners_inode_before="$(stat -c %i .muse-host-targets-owners.json)"
          scripts/build-host-targets.sh mcp-server 2>&1 | tee -a host-build.log
          assert_mcp_state
          test "$(stat -c %i .mcp.json)" != "$registry_inode_before"
          test "$(stat -c %i .muse-host-targets-owners.json)" != "$owners_inode_before"
          sha256sum .mcp.json > "$manifest_dir/after-mcp.sha256"
          sha256sum .muse-host-targets-owners.json \
            > "$manifest_dir/after-mcp-owners.sha256"
          diff -u "$manifest_dir/first-mcp.sha256" "$manifest_dir/after-mcp.sha256"
          diff -u \
            "$manifest_dir/first-mcp-owners.sha256" \
            "$manifest_dir/after-mcp-owners.sha256"

          node --input-type=module - "$manifest_dir/reader.stop" <<'NODE' &
          import {existsSync, readFileSync} from "node:fs";
          const [stopPath] = process.argv.slice(2);
          const waitState = new Int32Array(new SharedArrayBuffer(4));
          const expected = ["eta-mu-claude", "eta-mu-receipt-river"];
          while (!existsSync(stopPath)) {
            const servers = JSON.parse(readFileSync(".mcp.json", "utf8")).mcpServers ?? {};
            if (JSON.stringify(Object.keys(servers).sort()) !== JSON.stringify(expected)) {
              throw new Error(`reader observed transient MCP state: ${Object.keys(servers).sort()}`);
            }
            Atomics.wait(waitState, 0, 0, 1);
          }
          NODE
          reader_pid="$!"
          registry_inode_before="$(stat -c %i .mcp.json)"
          owners_inode_before="$(stat -c %i .muse-host-targets-owners.json)"
          set +e
          scripts/build-host-targets.sh claude-server 2>&1 | tee -a host-build.log
          claude_status="${PIPESTATUS[0]}"
          touch "$manifest_dir/reader.stop"
          wait "$reader_pid"
          reader_status="$?"
          set -e
          test "$claude_status" -eq 0
          test "$reader_status" -eq 0
          assert_mcp_state
          test "$(stat -c %i .mcp.json)" != "$registry_inode_before"
          test "$(stat -c %i .muse-host-targets-owners.json)" != "$owners_inode_before"
          sha256sum .mcp.json > "$manifest_dir/after-claude.sha256"
          sha256sum .muse-host-targets-owners.json \
            > "$manifest_dir/after-claude-owners.sha256"
          diff -u "$manifest_dir/first-mcp.sha256" "$manifest_dir/after-claude.sha256"
          diff -u \
            "$manifest_dir/first-mcp-owners.sha256" \
            "$manifest_dir/after-claude-owners.sha256"

          node --input-type=module <<'NODE'
          import {readFileSync, writeFileSync} from "node:fs";
          for (const path of [".mcp.json", ".muse-host-targets-owners.json"]) {
            writeFileSync(path, `${JSON.stringify(JSON.parse(readFileSync(path, "utf8")))}\n`);
          }
          NODE
          sha256sum .mcp.json > "$manifest_dir/before-failure.sha256"
          sha256sum .muse-host-targets-owners.json \
            > "$manifest_dir/before-failure-owners.sha256"
          rollback_hash="$(cut -d ' ' -f 1 "$manifest_dir/before-failure.sha256")"
          rollback_owners_hash="$(cut -d ' ' -f 1 "$manifest_dir/before-failure-owners.sha256")"
          real_node="$(command -v node)"
          mkdir "$manifest_dir/failing-bin"
          cat > "$manifest_dir/failing-bin/node" <<SH
          #!/usr/bin/env bash
          set -euo pipefail
          if [[ "\${1-}" == ".claude/dist/claude-server.js" && "\${2-}" == "--emit-hook-config" ]]; then
            "$real_node" --input-type=module -e '
              import {createHash} from "node:crypto";
              import {readFileSync} from "node:fs";
              const bytes = readFileSync(".mcp.json");
              const ownershipBytes = readFileSync(".muse-host-targets-owners.json");
              const servers = JSON.parse(bytes.toString("utf8")).mcpServers ?? {};
              const expected = ["eta-mu-claude", "eta-mu-receipt-river"];
              if (JSON.stringify(Object.keys(servers).sort()) !== JSON.stringify(expected)) process.exit(72);
              if (createHash("sha256").update(bytes).digest("hex") === "$rollback_hash") process.exit(71);
              const targets = JSON.parse(ownershipBytes.toString("utf8")).targets ?? {};
              const expectedTargets = {
                "claude-server": "eta-mu-claude",
                "mcp-server": "eta-mu-receipt-river",
              };
              if (JSON.stringify(targets) !== JSON.stringify(expectedTargets)) process.exit(70);
              if (createHash("sha256").update(ownershipBytes).digest("hex") === "$rollback_owners_hash") process.exit(69);
            '
            exit 73
          fi
          exec "$real_node" "\$@"
          SH
          chmod +x "$manifest_dir/failing-bin/node"
          set +e
          PATH="$manifest_dir/failing-bin:$PATH" \
            scripts/build-host-targets.sh claude-server 2>&1 | tee -a host-build.log
          failure_status="${PIPESTATUS[0]}"
          set -e
          if [[ "$failure_status" -ne 73 ]]; then
            echo "expected injected Claude hook exit 73; got $failure_status" >&2
            exit 1
          fi
          assert_mcp_state
          sha256sum .mcp.json > "$manifest_dir/after-failure.sha256"
          sha256sum .muse-host-targets-owners.json \
            > "$manifest_dir/after-failure-owners.sha256"
          diff -u "$manifest_dir/before-failure.sha256" "$manifest_dir/after-failure.sha256"
          diff -u \
            "$manifest_dir/before-failure-owners.sha256" \
            "$manifest_dir/after-failure-owners.sha256"

          scripts/build-host-targets.sh all 2>&1 | tee -a host-build.log
          find src/gen -type f -print0 | sort -z | xargs -0 sha256sum \
            > "$manifest_dir/second.sha256"
          sha256sum .mcp.json > "$manifest_dir/second-mcp.sha256"
          sha256sum .muse-host-targets-owners.json \
            > "$manifest_dir/second-mcp-owners.sha256"

          diff -u "$manifest_dir/first.sha256" "$manifest_dir/second.sha256"
          diff -u "$manifest_dir/first-mcp.sha256" "$manifest_dir/second-mcp.sha256"
          diff -u \
            "$manifest_dir/first-mcp-owners.sha256" \
            "$manifest_dir/second-mcp-owners.sha256"
          if grep -Eq "$warning_pattern" host-build.log; then
            grep -E "$warning_pattern" host-build.log >&2
            exit 1
          fi

      - name: Compile and run ClojureScript tests
        run: npx shadow-cljs compile test 2>&1 | tee test.log

      - name: Verify ClojureScript assertions
        run: grep -q "0 failures, 0 errors." test.log

      - name: Upload CI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-evidence
          path: |
            host-build.log
            test.log
          if-no-files-found: error
