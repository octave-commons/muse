name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Clojure CLI
        uses: DeLaGuardo/setup-clojure@13.2
        with:
          cli: 1.12.5.1654

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install locked JavaScript dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build generated host targets from a cold checkout
        shell: bash
        run: |
          set -euo pipefail
          test ! -e src/gen
          manifest_dir="$(mktemp -d)"
          warning_pattern='(^|[[:space:]])WARNING(:|[[:space:]]+#[0-9]+([[:space:]]*-[[:space:]]*)?)'
          printf '%s\n' 'WARNING: sample' | grep -Eq "$warning_pattern"
          printf '%s\n' '------ WARNING #1 - sample' | grep -Eq "$warning_pattern"
          if printf '%s\n' 'warning-free build' | grep -Eq "$warning_pattern"; then
            echo "warning pattern matched benign text" >&2
            exit 1
          fi

          cp .ημ/config/mcp/root.edn "$manifest_dir/mcp-root.edn"
          node --input-type=module <<'NODE'
          import {readFileSync, writeFileSync} from "node:fs";
          const path = ".ημ/config/mcp/root.edn";
          const original = readFileSync(path, "utf8");
          const changed = original.replace(
            ':publish {:mcp-config ".mcp.json"}',
            ":publish {}",
          );
          if (changed === original || changed.includes(":mcp-config")) {
            throw new Error("could not remove the MCP publication destination");
          }
          writeFileSync(path, changed);
          NODE
          real_clojure="$(command -v clojure)"
          mkdir "$manifest_dir/missing-config-bin"
          cat > "$manifest_dir/missing-config-bin/clojure" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          if [[ "$*" == *"generate-entrypoint"* ]]; then
            : > "$MUSE_TEST_GENERATOR_MARKER"
            exit 73
          fi
          exec "$MUSE_TEST_REAL_CLOJURE" "$@"
          SH
          chmod +x "$manifest_dir/missing-config-bin/clojure"
          set +e
          MUSE_TEST_REAL_CLOJURE="$real_clojure" \
            MUSE_TEST_GENERATOR_MARKER="$manifest_dir/missing-config-generated" \
            PATH="$manifest_dir/missing-config-bin:$PATH" \
            scripts/build-host-targets.sh mcp-server \
            > "$manifest_dir/missing-config.log" 2>&1
          missing_config_status="$?"
          set -e
          cp "$manifest_dir/mcp-root.edn" .ημ/config/mcp/root.edn
          test "$missing_config_status" -eq 64
          grep -Fq 'mcp-server does not configure :publish :mcp-config' \
            "$manifest_dir/missing-config.log"
          cmp -s "$manifest_dir/mcp-root.edn" .ημ/config/mcp/root.edn
          test ! -e "$manifest_dir/missing-config-generated"
          test ! -e src/gen
          test ! -e .muse-host-targets-producer-id
          test ! -e .mcp.json
          test ! -e .muse-host-targets-owners.json
          test ! -e .muse-host-targets-transaction.json
          test ! -e .muse-host-targets.lock
          test ! -e nil
          test ! -e nil.muse-host-targets-owners.json
          test ! -e nil.muse-host-targets-transaction.json
          test ! -e nil.muse-host-targets.lock

          test ! -e .muse-host-targets-owners.json
          node --input-type=module <<'NODE'
          import {writeFileSync} from "node:fs";
          const legacyRegistry = {
            mcpServers: {
              "eta-mu-claude": {
                command: "node",
                args: [".claude/dist/claude-server.js"],
              },
              "eta-mu-receipt-river": {
                command: "node",
                args: [".mcp/dist/receipt-river.js"],
              },
            },
          };
          writeFileSync(".mcp.json", `${JSON.stringify(legacyRegistry, null, 2)}\n`);
          NODE
          scripts/build-host-targets.sh all 2>&1 | tee host-build.log
          test -f .muse-host-targets-producer-id
          test ! -L .muse-host-targets-producer-id
          test "$(stat -c %a .muse-host-targets-producer-id)" = 600
          IFS= read -r MUSE_TEST_MCP_PRODUCER_ID < .muse-host-targets-producer-id
          [[ "$MUSE_TEST_MCP_PRODUCER_ID" =~ ^[0-9a-f]{64}$ ]]
          test "$MUSE_TEST_MCP_PRODUCER_ID" != "$(printf '0%.0s' {1..64})"
          export MUSE_TEST_MCP_PRODUCER_ID
          test "$(find src/gen -type f | wc -l)" -eq 3
          find src/gen -type f -print0 | sort -z | xargs -0 sha256sum \
            > "$manifest_dir/first.sha256"
          sha256sum .mcp.json > "$manifest_dir/first-mcp.sha256"
          sha256sum .muse-host-targets-owners.json \
            > "$manifest_dir/first-mcp-owners.sha256"
          cp .mcp.json "$manifest_dir/first-mcp.json"
          cp .muse-host-targets-owners.json "$manifest_dir/first-mcp-owners.json"

          assert_mcp_state() {
            node --input-type=module <<'NODE'
          import {readFileSync, realpathSync} from "node:fs";
          import {resolve} from "node:path";
          const config = JSON.parse(readFileSync(".mcp.json", "utf8"));
          const actual = config.mcpServers ?? {};
          const producerRoot = realpathSync(".");
          const expected = {
            "eta-mu-claude": [resolve(producerRoot, ".claude/dist/claude-server.js")],
            "eta-mu-receipt-river": [resolve(producerRoot, ".mcp/dist/receipt-river.js")],
          };
          if (JSON.stringify(Object.keys(actual).sort()) !== JSON.stringify(Object.keys(expected).sort())) {
            throw new Error(`unexpected MCP registrations: ${Object.keys(actual).sort().join(", ")}`);
          }
          for (const [name, args] of Object.entries(expected)) {
            if (actual[name]?.command !== "node" || JSON.stringify(actual[name]?.args) !== JSON.stringify(args)) {
              throw new Error(`incorrect MCP registration: ${name}`);
            }
          }
          const ownership = JSON.parse(
            readFileSync(".muse-host-targets-owners.json", "utf8"),
          );
          const expectedOwnership = {
            [`${process.env.MUSE_TEST_MCP_PRODUCER_ID}:claude-server`]: "eta-mu-claude",
            [`${process.env.MUSE_TEST_MCP_PRODUCER_ID}:mcp-server`]: "eta-mu-receipt-river",
          };
          if (ownership.version !== 2
              || JSON.stringify(ownership.targets) !== JSON.stringify(expectedOwnership)) {
            throw new Error(`unexpected MCP target ownership: ${JSON.stringify(ownership)}`);
          }
          NODE
          }

          assert_mcp_state

          lock_real_node="$(command -v node)"
          mkdir "$manifest_dir/lock-init-bin"
          cat > "$manifest_dir/lock-init-bin/node" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail

          if (($# == 3)) \
              && [[ -n "${MUSE_TEST_LOCK_BIND_SUBSTITUTE-}" ]] \
              && [[ ! -e "$MUSE_TEST_LOCK_BIND_SUBSTITUTE" ]]; then
            case "$3" in
              *.muse-host-targets.lock)
                mv -- "$3" "$3.bound-original"
                mkdir -m 0777 -- "$3"
                : > "$MUSE_TEST_LOCK_BIND_SUBSTITUTE"
                ;;
            esac
          fi

          lock_directory=""
          if (($# == 7)); then
            for argument in "$@"; do
              case "$argument" in
                *.muse-host-targets.lock) lock_directory="$argument" ;;
              esac
            done
          fi
          if [[ -z "$lock_directory" ]]; then
            exec "$MUSE_TEST_REAL_NODE" "$@"
          fi

          if [[ -n "${MUSE_TEST_LOCK_PRE_READY-}" ]]; then
            : > "$MUSE_TEST_LOCK_PRE_READY"
            for ((attempt = 0; attempt < 3000; attempt++)); do
              [[ -e "$MUSE_TEST_LOCK_PRE_GO" ]] && break
              sleep 0.01
            done
            [[ -e "$MUSE_TEST_LOCK_PRE_GO" ]] || exit 97
          fi

          set +e
          "$MUSE_TEST_REAL_NODE" "$@"
          node_status="$?"
          set -e
          if ((node_status != 0)) \
              && [[ -n "${MUSE_TEST_LOCK_SUBSTITUTION_MARKER-}" ]]; then
            shopt -s nullglob
            staged_owners=("$lock_directory"/.owner.*)
            if ((${#staged_owners[@]} > 0)); then
              unlink -- "${staged_owners[0]}"
              : > "${staged_owners[0]}"
              chmod 600 "${staged_owners[0]}"
              : > "$MUSE_TEST_LOCK_SUBSTITUTION_MARKER"
            fi
          fi

          if ((node_status == 0)) \
              && [[ -n "${MUSE_TEST_LOCK_POST_READY-}" ]]; then
            : > "$MUSE_TEST_LOCK_POST_READY"
            for ((attempt = 0; attempt < 3000; attempt++)); do
              [[ -e "$MUSE_TEST_LOCK_POST_GO" ]] && break
              sleep 0.01
            done
            [[ -e "$MUSE_TEST_LOCK_POST_GO" ]] || exit 98
          fi
          exit "$node_status"
          SH
          chmod +x "$manifest_dir/lock-init-bin/node"
          cat > "$manifest_dir/lock-init-bin/mktemp" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          if [[ "${MUSE_TEST_FAIL_MKTEMP-}" == 1 ]]; then
            exit 73
          fi
          exec /usr/bin/mktemp "$@"
          SH
          chmod +x "$manifest_dir/lock-init-bin/mktemp"

          sha256sum .mcp.json .muse-host-targets-owners.json \
            > "$manifest_dir/before-private-lock-substitution.sha256"
          lock_bind_substitution_marker="$manifest_dir/lock-bind-substitution-observed"
          set +e
          MUSE_TEST_REAL_NODE="$lock_real_node" \
            MUSE_TEST_FAIL_MKTEMP=1 \
            MUSE_TEST_LOCK_BIND_SUBSTITUTE="$lock_bind_substitution_marker" \
            PATH="$manifest_dir/lock-init-bin:$PATH" \
            scripts/build-host-targets.sh mcp-server 2>&1 | tee -a host-build.log
          lock_bind_substitution_status="${PIPESTATUS[0]}"
          set -e
          test "$lock_bind_substitution_status" -eq 64
          test -e "$lock_bind_substitution_marker"
          grep -Fq 'MCP lock directory is not the bound private lock' host-build.log
          test -d .muse-host-targets.lock
          test -d .muse-host-targets.lock.bound-original
          test "$(stat -c %a .muse-host-targets.lock)" = 777
          test "$(stat -c %u .muse-host-targets.lock)" = "$(id -u)"
          test "$(stat -c %a .muse-host-targets.lock.bound-original)" = 700
          test "$(stat -c %u .muse-host-targets.lock.bound-original)" = "$(id -u)"
          test "$(find .muse-host-targets.lock -mindepth 1 -maxdepth 1 | wc -l)" -eq 0
          test "$(find .muse-host-targets.lock.bound-original -mindepth 1 -maxdepth 1 | wc -l)" -eq 0
          sha256sum .mcp.json .muse-host-targets-owners.json \
            > "$manifest_dir/after-private-lock-substitution.sha256"
          diff -u "$manifest_dir/before-private-lock-substitution.sha256" \
            "$manifest_dir/after-private-lock-substitution.sha256"
          rmdir -- .muse-host-targets.lock .muse-host-targets.lock.bound-original
          test ! -e .muse-host-targets.lock
          test ! -e .muse-host-targets.lock.bound-original
          assert_mcp_state

          sha256sum .mcp.json .muse-host-targets-owners.json \
            > "$manifest_dir/before-owner-write-failure.sha256"
          owner_pre_ready="$manifest_dir/owner-pre.ready"
          owner_pre_go="$manifest_dir/owner-pre.go"
          owner_write_status_file="$manifest_dir/owner-write.status"
          owner_substitution_marker="$manifest_dir/owner-substitution-observed"
          (
            set +e
            (
              umask 000
              ulimit -c 0
              ulimit -f 0
              MUSE_TEST_REAL_NODE="$lock_real_node" \
                MUSE_TEST_LOCK_PRE_READY="$owner_pre_ready" \
                MUSE_TEST_LOCK_PRE_GO="$owner_pre_go" \
                MUSE_TEST_LOCK_SUBSTITUTION_MARKER="$owner_substitution_marker" \
                PATH="$manifest_dir/lock-init-bin:$PATH" \
                scripts/build-host-targets.sh mcp-server
            )
            printf '%s\n' "$?" > "$owner_write_status_file"
            exit 0
          ) 2>&1 | tee -a host-build.log &
          owner_write_job="$!"
          for ((attempt = 0; attempt < 3000; attempt++)); do
            [[ -e "$owner_pre_ready" ]] && break
            sleep 0.01
          done
          owner_lock_mode="$(stat -c %a .muse-host-targets.lock 2>/dev/null || true)"
          owner_preexisting_state=0
          [[ ! -e .muse-host-targets.lock/owner ]] || owner_preexisting_state=1
          : > "$owner_pre_go"
          wait "$owner_write_job"
          test -e "$owner_write_status_file"
          owner_write_failure_status="$(cat "$owner_write_status_file")"
          test "$owner_lock_mode" = 700
          test "$owner_preexisting_state" -eq 0
          test "$owner_write_failure_status" -eq 64
          grep -Fq 'could not record ownership of the MCP build lock' host-build.log
          test ! -e "$owner_substitution_marker"
          test ! -e .muse-host-targets.lock
          sha256sum .mcp.json .muse-host-targets-owners.json \
            > "$manifest_dir/after-owner-write-failure.sha256"
          diff -u "$manifest_dir/before-owner-write-failure.sha256" \
            "$manifest_dir/after-owner-write-failure.sha256"
          assert_mcp_state

          node --input-type=module <<'NODE'
          import {writeFileSync} from "node:fs";
          writeFileSync(
            ".muse-host-targets-owners.json",
            `${JSON.stringify({version: 1, targets: {}}, null, 2)}\n`,
          );
          NODE
          owner_post_ready="$manifest_dir/owner-post.ready"
          owner_post_go="$manifest_dir/owner-post.go"
          owner_success_status_file="$manifest_dir/owner-success.status"
          sha256sum .mcp.json .muse-host-targets-owners.json \
            > "$manifest_dir/before-private-owner.sha256"
          (
            set +e
            (
              umask 0777
              MUSE_TEST_REAL_NODE="$lock_real_node" \
                MUSE_TEST_FAIL_MKTEMP=1 \
                MUSE_TEST_LOCK_POST_READY="$owner_post_ready" \
                MUSE_TEST_LOCK_POST_GO="$owner_post_go" \
                PATH="$manifest_dir/lock-init-bin:$PATH" \
                scripts/build-host-targets.sh mcp-server
            )
            printf '%s\n' "$?" > "$owner_success_status_file"
            exit 0
          ) 2>&1 | tee -a host-build.log &
          owner_success_job="$!"
          for ((attempt = 0; attempt < 3000; attempt++)); do
            [[ -e "$owner_post_ready" ]] && break
            sleep 0.01
          done
          private_lock_mode="$(stat -c %a .muse-host-targets.lock 2>/dev/null || true)"
          private_owner_mode="$(stat -c %a .muse-host-targets.lock/owner 2>/dev/null || true)"
          private_owner_uid="$(stat -c %u .muse-host-targets.lock/owner 2>/dev/null || true)"
          staged_owner_count="$(find .muse-host-targets.lock -maxdepth 1 -name '.owner.*' 2>/dev/null | wc -l)"
          : > "$owner_post_go"
          wait "$owner_success_job"
          test -e "$owner_success_status_file"
          test "$(cat "$owner_success_status_file")" -eq 73
          test "$private_lock_mode" = 700
          test "$private_owner_mode" = 600
          test "$private_owner_uid" = "$(id -u)"
          test "$staged_owner_count" -eq 0
          test ! -e .muse-host-targets.lock
          sha256sum .mcp.json .muse-host-targets-owners.json \
            > "$manifest_dir/after-private-owner.sha256"
          diff -u "$manifest_dir/before-private-owner.sha256" \
            "$manifest_dir/after-private-owner.sha256"
          scripts/build-host-targets.sh mcp-server 2>&1 | tee -a host-build.log
          node --input-type=module <<'NODE'
          import {readFileSync} from "node:fs";
          const registry = JSON.parse(readFileSync(".mcp.json", "utf8")).mcpServers ?? {};
          if (!registry["eta-mu-claude"] || !registry["eta-mu-receipt-river"]) {
            throw new Error(`same-name neutral adoption lost a registration: ${JSON.stringify(registry)}`);
          }
          const ownership = JSON.parse(
            readFileSync(".muse-host-targets-owners.json", "utf8"),
          );
          const expected = {
            version: 2,
            targets: {
              [`${process.env.MUSE_TEST_MCP_PRODUCER_ID}:mcp-server`]: "eta-mu-receipt-river",
            },
          };
          if (JSON.stringify(ownership) !== JSON.stringify(expected)) {
            throw new Error(`same-name neutral adoption wrote incorrect ownership: ${JSON.stringify(ownership)}`);
          }
          NODE

          cp "$manifest_dir/first-mcp.json" .mcp.json
          node --input-type=module <<'NODE'
          import {readFileSync, writeFileSync} from "node:fs";
          const registry = JSON.parse(readFileSync(".mcp.json", "utf8"));
          registry.mcpServers["eta-mu-receipt-river"] = {
            command: "external-tool",
            args: ["must-not-be-overwritten"],
          };
          writeFileSync(".mcp.json", `${JSON.stringify(registry, null, 2)}\n`);
          writeFileSync(
            ".muse-host-targets-owners.json",
            `${JSON.stringify({version: 1, targets: {}}, null, 2)}\n`,
          );
          NODE
          sha256sum .mcp.json > "$manifest_dir/before-unowned-conflict.sha256"
          sha256sum .muse-host-targets-owners.json \
            > "$manifest_dir/before-unowned-conflict-owners.sha256"
          stat -c '%d:%i:%y' .mcp.json \
            > "$manifest_dir/before-unowned-conflict.stat"
          stat -c '%d:%i:%y' .muse-host-targets-owners.json \
            > "$manifest_dir/before-unowned-conflict-owners.stat"
          test ! -e .muse-host-targets-transaction.json
          set +e
          scripts/build-host-targets.sh mcp-server 2>&1 | tee -a host-build.log
          unowned_conflict_status="${PIPESTATUS[0]}"
          set -e
          test "$unowned_conflict_status" -ne 0
          grep -Fq 'unowned MCP registration eta-mu-receipt-river conflicts with generated output' \
            host-build.log
          sha256sum .mcp.json > "$manifest_dir/after-unowned-conflict.sha256"
          sha256sum .muse-host-targets-owners.json \
            > "$manifest_dir/after-unowned-conflict-owners.sha256"
          diff -u "$manifest_dir/before-unowned-conflict.sha256" \
            "$manifest_dir/after-unowned-conflict.sha256"
          diff -u "$manifest_dir/before-unowned-conflict-owners.sha256" \
            "$manifest_dir/after-unowned-conflict-owners.sha256"
          stat -c '%d:%i:%y' .mcp.json \
            > "$manifest_dir/after-unowned-conflict.stat"
          stat -c '%d:%i:%y' .muse-host-targets-owners.json \
            > "$manifest_dir/after-unowned-conflict-owners.stat"
          diff -u "$manifest_dir/before-unowned-conflict.stat" \
            "$manifest_dir/after-unowned-conflict.stat"
          diff -u "$manifest_dir/before-unowned-conflict-owners.stat" \
            "$manifest_dir/after-unowned-conflict-owners.stat"
          test ! -e .muse-host-targets-transaction.json
          cp "$manifest_dir/first-mcp.json" .mcp.json
          cp "$manifest_dir/first-mcp-owners.json" .muse-host-targets-owners.json
          assert_mcp_state

          node --input-type=module <<'NODE'
          import {readFileSync, writeFileSync} from "node:fs";
          const registry = JSON.parse(readFileSync(".mcp.json", "utf8"));
          registry.mcpServers["eta-mu-receipt-river"].args = [
            ".mcp/dist/receipt-river.js",
          ];
          writeFileSync(".mcp.json", `${JSON.stringify(registry, null, 2)}\n`);
          const ownership = JSON.parse(
            readFileSync(".muse-host-targets-owners.json", "utf8"),
          );
          delete ownership.targets[`${process.env.MUSE_TEST_MCP_PRODUCER_ID}:mcp-server`];
          writeFileSync(
            ".muse-host-targets-owners.json",
            `${JSON.stringify(ownership, null, 2)}\n`,
          );
          NODE
          sha256sum .mcp.json .muse-host-targets-owners.json \
            > "$manifest_dir/before-v2-relative-conflict.sha256"
          stat -c '%n:%d:%i:%y' .mcp.json .muse-host-targets-owners.json \
            > "$manifest_dir/before-v2-relative-conflict.stat"
          set +e
          scripts/build-host-targets.sh mcp-server 2>&1 | tee -a host-build.log
          v2_relative_conflict_status="${PIPESTATUS[0]}"
          set -e
          test "$v2_relative_conflict_status" -ne 0
          grep -Fq 'unowned MCP registration eta-mu-receipt-river conflicts with generated output' \
            host-build.log
          sha256sum .mcp.json .muse-host-targets-owners.json \
            > "$manifest_dir/after-v2-relative-conflict.sha256"
          stat -c '%n:%d:%i:%y' .mcp.json .muse-host-targets-owners.json \
            > "$manifest_dir/after-v2-relative-conflict.stat"
          diff -u "$manifest_dir/before-v2-relative-conflict.sha256" \
            "$manifest_dir/after-v2-relative-conflict.sha256"
          diff -u "$manifest_dir/before-v2-relative-conflict.stat" \
            "$manifest_dir/after-v2-relative-conflict.stat"
          test ! -e .muse-host-targets-transaction.json
          cp "$manifest_dir/first-mcp.json" .mcp.json
          cp "$manifest_dir/first-mcp-owners.json" .muse-host-targets-owners.json
          assert_mcp_state

          checkout_b="$manifest_dir/checkout-b"
          git worktree add --detach "$checkout_b" HEAD
          ln -s "$PWD/node_modules" "$checkout_b/node_modules"
          node --input-type=module - "$checkout_b/.ημ/config/mcp/root.edn" "$PWD/.mcp.json" <<'NODE'
          import {readFileSync, writeFileSync} from "node:fs";
          const [configPath, destination] = process.argv.slice(2);
          const source = readFileSync(configPath, "utf8");
          const changed = source
            .replace(":id                 :eta-mu/claude-receipt-river", ":id                 :eta-mu/checkout-b")
            .replace(':info {:name "eta-mu-receipt-river"', ':info {:name "eta-mu-checkout-b"')
            .replace(':mcp-config ".mcp.json"', `:mcp-config "${destination}"`);
          if (changed === source
              || !changed.includes("eta-mu-checkout-b")
              || !changed.includes(`:mcp-config "${destination}"`)) {
            throw new Error("checkout-B MCP fixture did not change config");
          }
          writeFileSync(configPath, changed);
          NODE
          node --input-type=module <<'NODE'
          import {readFileSync, writeFileSync} from "node:fs";
          const registry = JSON.parse(readFileSync(".mcp.json", "utf8"));
          registry.mcpServers["eta-mu-unowned-copy"] =
            registry.mcpServers["eta-mu-receipt-river"];
          writeFileSync(".mcp.json", `${JSON.stringify(registry, null, 2)}\n`);
          const legacyOwnership = {
            version: 1,
            targets: {
              "claude-server": "eta-mu-claude",
              "mcp-server": "eta-mu-receipt-river",
            },
          };
          writeFileSync(
            ".muse-host-targets-owners.json",
            `${JSON.stringify(legacyOwnership, null, 2)}\n`,
          );
          NODE
          (
            cd "$checkout_b"
            scripts/build-host-targets.sh mcp-server
          ) 2>&1 | tee -a host-build.log
          test -f "$checkout_b/.muse-host-targets-producer-id"
          test ! -L "$checkout_b/.muse-host-targets-producer-id"
          test "$(stat -c %a "$checkout_b/.muse-host-targets-producer-id")" = 600
          IFS= read -r checkout_b_producer_id \
            < "$checkout_b/.muse-host-targets-producer-id"
          [[ "$checkout_b_producer_id" =~ ^[0-9a-f]{64}$ ]]
          test "$checkout_b_producer_id" != "$(printf '0%.0s' {1..64})"
          test "$checkout_b_producer_id" != "$MUSE_TEST_MCP_PRODUCER_ID"
          scripts/build-host-targets.sh claude-server 2>&1 | tee -a host-build.log
