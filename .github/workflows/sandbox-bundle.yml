name: Sandbox bundle

on:
  workflow_dispatch:
    inputs:
      include_dependency_cache:
        description: Include npm and JVM caches in a separate short-lived artifact
        required: false
        default: false
        type: boolean
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - "deps.edn"
      - "shadow-cljs.edn"
      - "src/**"
      - "test/**"
      - ".ημ/**"
      - "scripts/**"
      - ".github/workflows/sandbox-bundle.yml"
  push:
    branches:
      - "**"
    tags:
      - "sandbox-bundle-*"
    paths:
      - ".github/workflows/sandbox-bundle.yml"

permissions:
  contents: read

concurrency:
  group: sandbox-bundle-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CLOJURE_TOOLS_VERSION: "1.12.5.1654"
      CLOJURE_TOOLS_SHA256: "dc86cc56bc372fcef07bd87f44693eeb4b61cf5f44347883878364d03b5fb342"
      BABASHKA_VERSION: "1.13.219"
      BABASHKA_SHA256: "9ac1fe988d7001625b30ef3e3307e67f8545505a7cb49a4aa179f578115a3e09"

    steps:
      - name: Check out full repository history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Initialize bundle paths
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "OUT=$RUNNER_TEMP/sandbox-export"
            echo "DEPS_OUT=$RUNNER_TEMP/sandbox-deps"
          } >> "$GITHUB_ENV"

      - name: Prepare revision-bound source bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT"
          mkdir -p "$OUT"/{source,runtime,logs,toolchain,metadata}
          repo_name="${GITHUB_REPOSITORY#*/}"
          git bundle create "$OUT/source/${repo_name}.bundle" --all
          git archive --format=tar.gz --prefix="${repo_name}/" --output="$OUT/source/source.tar.gz" HEAD
          git rev-parse HEAD > "$OUT/metadata/revision.txt"
          git status --short > "$OUT/metadata/worktree.txt"
          git submodule status --recursive > "$OUT/metadata/submodules.txt" 2>&1 || true

      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Set up pinned Clojure CLI
        uses: DeLaGuardo/setup-clojure@3fe9b3ae632c6758d0b7757b0838606ef4287b08 # 13.4
        with:
          cli: ${{ env.CLOJURE_TOOLS_VERSION }}

      - name: Install, validate, test, and build
        id: validate
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          {
            npm ci --ignore-scripts --no-audit --no-fund
            clojure -M -e "(doseq [generator '[eta-mu.opencode.build/generate-entrypoint eta-mu.mcp.build/generate-entrypoint eta-mu.claude.build/generate-entrypoint]] ((requiring-resolve generator) {}))"
            npx shadow-cljs release daemon
            npx shadow-cljs release opencode-plugin
            npx shadow-cljs release mcp-server
            npx shadow-cljs release claude-server
            npx shadow-cljs compile test
            node target/test/test.cjs
          } 2>&1 | tee "$OUT/logs/validate.log"

      - name: Collect generated outputs and portable toolchains
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          paths_file="$RUNNER_TEMP/sandbox-runtime-paths"
          : > "$paths_file"
          find . -type d \( -name dist -o -name 'dist-*' -o -name target -o -name coverage -o -name reports -o -name '.opencode' -o -name '.mcp' -o -name '.claude' \) \
            -not -path '*/node_modules/*' \
            -not -path '*/.git/*' \
            -not -path '*/.shadow-cljs/*' \
            -print0 >> "$paths_file"
          if [[ -s "$paths_file" ]]; then
            tar --null --files-from="$paths_file" -czf "$OUT/runtime/runtime.tar.gz"
          fi

          download_dir="$RUNNER_TEMP/toolchain-downloads"
          rm -rf "$download_dir"
          mkdir -p "$download_dir"
          clojure_archive="clojure-tools-${CLOJURE_TOOLS_VERSION}.tar.gz"
          babashka_archive="babashka-${BABASHKA_VERSION}-linux-amd64-static.tar.gz"

          curl -fsSL \
            "https://download.clojure.org/install/clojure-tools-${CLOJURE_TOOLS_VERSION}.tar.gz" \
            -o "$download_dir/$clojure_archive"
          curl -fsSL \
            "https://github.com/babashka/babashka/releases/download/v${BABASHKA_VERSION}/babashka-${BABASHKA_VERSION}-linux-amd64-static.tar.gz" \
            -o "$download_dir/$babashka_archive"
          printf '%s  %s\n' "$CLOJURE_TOOLS_SHA256" "$download_dir/$clojure_archive" \
            | sha256sum --check --strict
          printf '%s  %s\n' "$BABASHKA_SHA256" "$download_dir/$babashka_archive" \
            | sha256sum --check --strict
          install -m 0644 "$download_dir/$clojure_archive" "$OUT/toolchain/$clojure_archive"
          install -m 0644 "$download_dir/$babashka_archive" "$OUT/toolchain/$babashka_archive"

          for file in package.json package-lock.json deps.edn shadow-cljs.edn index.d.ts; do
            [[ -f "$file" ]] && cp "$file" "$OUT/metadata/$file"
          done
          {
            node --version
            npm --version
            java -version
            command -v clojure >/dev/null 2>&1 && clojure -Sdescribe || true
          } > "$OUT/metadata/tool-versions.txt" 2>&1

          cat > "$OUT/manifest.json" <<EOF
          {
            "sandbox_bundle_version": 1,
            "repository": "${GITHUB_REPOSITORY}",
            "revision": "${GITHUB_SHA}",
            "ref": "${GITHUB_REF}",
            "generated_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "validation": "${{ steps.validate.outcome }}",
            "entrypoint": "node target/test/test.cjs",
            "runtime_dependency_closure_included": false,
            "network_required_after_restore": true
          }
          EOF
          (cd "$OUT" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)

      - name: Package optional dependency cache
        if: github.event_name == 'workflow_dispatch' && inputs.include_dependency_cache
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$DEPS_OUT"
          mkdir -p "$DEPS_OUT"
          cache="$(npm config get cache 2>/dev/null || true)"
          if [[ -n "$cache" && -d "$cache" ]]; then
            tar -czf "$DEPS_OUT/npm-cache.tar.gz" -C "$(dirname "$cache")" "$(basename "$cache")"
          fi
          if [[ -d "$HOME/.m2/repository" ]]; then
            tar -czf "$DEPS_OUT/m2-repository.tar.gz" -C "$HOME/.m2" repository
          fi
          if [[ -d "$HOME/.gitlibs" ]]; then
            tar -czf "$DEPS_OUT/gitlibs.tar.gz" -C "$HOME" .gitlibs
          fi
          (cd "$DEPS_OUT" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)

      - name: Upload sandbox bundle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: muse-sandbox-${{ github.sha }}
          path: ${{ runner.temp }}/sandbox-export
          if-no-files-found: error
          retention-days: 30

      - name: Upload optional dependency cache
        if: github.event_name == 'workflow_dispatch' && inputs.include_dependency_cache
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: muse-sandbox-deps-${{ github.sha }}
          path: ${{ runner.temp }}/sandbox-deps
          if-no-files-found: error
          retention-days: 7

      - name: Preserve validation result
        if: always() && steps.validate.outcome == 'failure'
        shell: bash
        run: exit 1
